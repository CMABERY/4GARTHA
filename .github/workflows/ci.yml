name: Governance Gates

on:
  pull_request:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  ledger:
    name: Ledger Integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install (locked)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock
          pip install -e . --no-deps

      - name: Unit tests
        run: pytest -q

      - name: Resolve ledger diff base
        # Immutable, event-appropriate base (see tools/ci_diff_base.py):
        #   pull_request      -> pull_request.base.sha, range base...HEAD
        #   push              -> event.before compared directly with HEAD (whole pushed range)
        #   initial push      -> empty tree (every file counts as added)
        #   workflow_dispatch -> empty tree (full audit of every node)
        # Unknown events and unavailable bases fail the job.
        id: diffbase
        run: python tools/ci_diff_base.py

      - name: Enforce append-only nodes/objects
        env:
          LEDGER_DIFF_BASE: ${{ steps.diffbase.outputs.base }}
          LEDGER_DIFF_ARGS: ${{ steps.diffbase.outputs.diff_args }}
        run: |
          python tools/check_append_only.py $LEDGER_DIFF_ARGS "$LEDGER_DIFF_BASE"

      - name: Verify and replay newly added nodes (strong verification)
        # Verifies each new node and all reachable ancestors before replaying.
        # WARNING: this executes transform code.
        # Use only if your threat model permits executing transforms in CI.
        env:
          LEDGER_DIFF_BASE: ${{ steps.diffbase.outputs.base }}
          LEDGER_DIFF_ARGS: ${{ steps.diffbase.outputs.diff_args }}
        run: |
          python tools/replay_new_nodes.py $LEDGER_DIFF_ARGS "$LEDGER_DIFF_BASE"

  sprint1:
    name: Sprint-1 Frozen Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install (locked)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock

      - name: Sprint-1 Frozen gate
        run: |
          bash ci/run_verify_fixtures.sh
