name: Governance Gates

on:
  pull_request:
  push:
    branches: [ main ]
  workflow_dispatch:

# Least privilege for every job: this workflow runs code from pull requests
# (tests, tools), so its token must not be able to write to the repository.
# ASSURANCE.md, "P0: no transform execution in CI".
permissions:
  contents: read

jobs:
  ledger:
    name: Ledger Integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install (locked)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock
          pip install -e . --no-deps

      - name: Unit tests
        run: pytest -q

      - name: Resolve ledger diff base
        # Immutable, event-appropriate base (see tools/ci_diff_base.py):
        #   pull_request      -> pull_request.base.sha, range base...HEAD
        #   push              -> event.before compared directly with HEAD (whole pushed range)
        #   initial push      -> empty tree (every file counts as added)
        #   workflow_dispatch -> empty tree (full audit of every record)
        # Unknown events and unavailable bases fail the job.
        id: diffbase
        run: python tools/ci_diff_base.py

      - name: Enforce append-only objects/records
        env:
          LEDGER_DIFF_BASE: ${{ steps.diffbase.outputs.base }}
          LEDGER_DIFF_ARGS: ${{ steps.diffbase.outputs.diff_args }}
        run: |
          python tools/check_append_only.py $LEDGER_DIFF_ARGS "$LEDGER_DIFF_BASE"

      - name: Verify newly added records (integrity profile; no transform execution)
        # Checks every new record and its whole lineage: canonical bytes, schema,
        # record-ID binding, input records present, artifacts present and
        # matching their digests. Rejects legacy v0 ledger/nodes/ manifests.
        # Derivation replay is DISABLED in CI until replay runs inside an
        # enforced isolation boundary; derivation_verification is reported
        # NOT_CHECKED. Do not add --replay here (tests/test_conformance.py).
        env:
          LEDGER_DIFF_BASE: ${{ steps.diffbase.outputs.base }}
          LEDGER_DIFF_ARGS: ${{ steps.diffbase.outputs.diff_args }}
        run: |
          python tools/verify_new_records.py $LEDGER_DIFF_ARGS "$LEDGER_DIFF_BASE"

  sprint1:
    name: Sprint-1 Frozen Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install (locked)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock

      - name: Sprint-1 Frozen gate
        run: |
          bash ci/run_verify_fixtures.sh
