[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "epistemic-ledger"
version = "0.3.0"
description = "Content-addressed evidence and provenance ledger with explicitly scoped, testable assurance claims (see ASSURANCE.md) + Sprint-1 verifier fencepost."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "jsonschema==4.25.1",
]

[project.optional-dependencies]
# Ed25519 for external anchoring (ASSURANCE.md 5.7): checkpoint, Sigsum leaf,
# tree head and witness signatures. Without it the base install still runs every
# structural and hash check of the anchor log, and governance stays NOT_CHECKED.
anchor = [
  "cryptography==50.0.2",
]
dev = [
  "pytest==8.2.2",
]

[project.scripts]
ledger = "ledger.cli:main"

[tool.setuptools.package-data]
# Record schema used by ledger.records (identical copy of ledger/schema/record.schema.json).
ledger = ["record.schema.json"]

[tool.pytest.ini_options]
# Tests live under tests/. A test module elsewhere must be listed here as a
# non-overlapping root (e.g. "tests" and "." make pytest drop root-level tests).
# tests/test_collection.py fails if any tracked test module is not collected.
testpaths = ["tests"]
python_files = ["test_*.py"]
