[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "epistemic-ledger"
version = "0.1.0"
description = "Immutable, content-addressed DAG ledger + Sprint-1 verifier fencepost."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "jsonschema==4.25.1",
]

[project.optional-dependencies]
dev = [
  "pytest==8.2.2",
]

[project.scripts]
ledger = "ledger.cli:main"

[tool.setuptools.package-data]
# Node manifest schema used by ledger.verify / ledger.replay (copy of ledger/schema/node.schema.json).
ledger = ["node.schema.json"]

[tool.pytest.ini_options]
# Non-overlapping roots: overlapping entries (e.g. "tests" and ".") make pytest
# drop the root-level tests. tests/test_collection.py guards this.
testpaths = ["tests", "test_memory_system.py"]
python_files = ["test_*.py"]
